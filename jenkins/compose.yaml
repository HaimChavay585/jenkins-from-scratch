services:
  jenkins:
    build: .
    image: jenkins-with-docker:local
    container_name: jenkins
    group_add:
      - "0"
    restart: unless-stopped
    ports:
      - "8080:8080"     # web UI
      - "50000:50000"   # inbound agents, unused for now
    environment:
      - JENKINS_HOME=/var/jenkins_home
      - JAVA_OPTS=-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
      - /Users/haimchavay/workspace/my_projects/jenkins-from-scratch:/var/jenkins_home/my-repo

volumes:
  jenkins_home: