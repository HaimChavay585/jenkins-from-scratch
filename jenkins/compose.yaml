services:
  jenkins:
    build: .
    image: jenkins-with-docker:local
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"     # web UI
      - "50000:50000"   # inbound agents, unused for now
    environment:
      - JENKINS_HOME=/var/jenkins_home
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home: